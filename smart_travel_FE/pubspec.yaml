name: smart_travel
description: "Smart Travel Of 6 Members"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  dio: ^5.4.3+1
  
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  http: ^1.1.0
  connectivity_plus: ^5.0.2

  # Dependency Injection
  get_it: ^7.6.4

  # Functional Programming
  dartz: ^0.10.1

  shared_preferences: ^2.2.3

  # Security
  flutter_secure_storage: ^9.0.0

  # UI
  awesome_snackbar_content: ^0.1.3
  lottie: ^2.6.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  webview_flutter: ^4.13.0

  # Firebase
  firebase_auth: ^4.17.8
  firebase_core: ^2.30.0
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^6.0.3

  # Image Picker for Avatar Upload
  image_picker: ^1.0.7

  # Maps & Location
  google_maps_flutter: ^2.7.0
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/